<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3121FF" />
  <title>Krono</title>
  <meta name="description" content="A daily game: five challenges to test your intuition of time. One shot each, same five for everyone, resets at midnight UTC." />

  <!-- Icons. The favicon is an inline SVG (no asset request); iOS ignores SVG for
       apple-touch-icon, so the home-screen icon is a real 180px PNG. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='38' fill='%233121FF'/><rect x='74' y='16' width='32' height='14' rx='5' fill='%23fff'/><rect x='84' y='27' width='12' height='19' fill='%23fff'/><circle cx='90' cy='104' r='52' fill='none' stroke='%23fff' stroke-width='13'/><path d='M90 104V74M90 104h24' stroke='%23fff' stroke-width='12' stroke-linecap='round' fill='none'/></svg>" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Link previews (iMessage / Slack / Discord). Text-only for now — no og:image. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Krono" />
  <meta property="og:title" content="Krono — the daily time game" />
  <meta property="og:description" content="Five challenges to test your intuition of time. One shot, once a day. How many seconds were you off?" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Krono — the daily time game" />
  <meta name="twitter:description" content="Five challenges to test your intuition of time. One shot, once a day. How many seconds were you off?" />

  <!-- ONE typeface, self-hosted, preloaded.
       Previously two families came from fonts.googleapis.com behind two
       preconnects and a render-blocking stylesheet, which meant the score
       screen could paint its figures in a fallback face and then reflow them.
       This is the Latin subset of Archivo's variable font — 88KB, one request,
       same origin, preloaded so it is in cache before the first paint. It
       carries U+2212 MINUS SIGN, which every negative reading depends on. -->
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    @font-face {
      font-family: 'Archivo';
      font-style: normal;
      font-weight: 500 900;
      font-stretch: 62% 125%;
      /* `block` rather than `swap`: the file is preloaded and same-origin, so
         the block period is imperceptible, and a swap would repaint every
         numeral on the score screen in a different face mid-read. */
      font-display: block;
      src: url(fonts/archivo-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
        U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
        U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <button id="mute" class="mute-toggle" type="button" aria-pressed="false">SOUND</button>
  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
